db: data/haythos.db
vault: data/vault.enc
default_model: claude-api

models:
  claude-api: { kind: anthropic, model: claude-sonnet-5-5, secret: anthropic }
  claude-sub: { kind: claudesdk }
  openai: { kind: openai, base_url: https://api.openai.com/v1, model: gpt-5, secret: openai }
  # ChatGPT plan via Sign in with ChatGPT; run `haythos auth chatgpt` first. model is optional (empty = first model your account lists).
  # chatgpt-sub: { kind: chatgpt, model: gpt-5 }

# claudesdk runs this CLI once per step; the token comes from the vault entry "claude" and is injected as CLAUDE_CODE_OAUTH_TOKEN.
claude_cli:
  command: claude

discord:
  owner_id: ""

# Runtimes run heavy work as processes; a job picks one with `runtime: { alias, workdir }` (see jobs/examples/).
# workdirs maps a name to an absolute folder: jobs name the folder, they never carry a path.
# Every permission request goes through the guard: policy.StarterRules plus your `guard` rules
# (action: ask | deny; `starter_guard: false` drops the starter list). Matching is on text, so it is a guard rail, not a sandbox.
# runtimes:
#   opencode:
#     kind: acp             # must be made to ask: OPENCODE_CONFIG_CONTENT with permission.bash ask in env (checked), or `commands_ask: true` for another runtime
#     command: opencode
#     args: [acp]
#     model: ""
#     mode: ""
#     pass_env: []
#     env:
#       - 'OPENCODE_CONFIG_CONTENT={"permission":{"bash":{"*":"ask"},"edit":{"*":"allow","*opencode.json":"ask","*.opencode/*":"ask"},"read":{"*":"allow","*.env":"ask","*.env.*":"ask","*/.ssh/*":"ask","*/.aws/*":"ask","*/.netrc":"ask","*/.git-credentials":"ask","*/.gnupg/*":"ask"}}}'
#     workdirs:
#       scratch: /absolute/path/to/scratch-repo
#     guard:
#       - { name: no-curl, kinds: [execute], command: true, pattern: '^curl\b', action: deny }
