version: "1"
tiers:
  file.list: 0
  file.search: 0
  file.read: 0
  git.status: 0
  git.diff: 0
  git.log: 0
  git.show: 0
  discord.channels: 0
  discord.post: 2
  brain.recall: 0
  brain.remember: 1
  brain.forget: 1
# Tier 1 writes that run without approval in an untainted task from the owner (owner/) or a background brain task (auto/; forget only inbox/ slugs).
auto_when_clean: [brain.remember, brain.forget]
# Vault names each tool's arguments may reference as secret://<name>. Unlisted handles are denied.
secrets: {}
