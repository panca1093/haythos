db: data/haythos.db
vault: data/vault.enc
default_model: claude-api

models:
  claude-api: { kind: anthropic, model: claude-sonnet-5-5, secret: anthropic }
  claude-sub: { kind: claudesdk }
  openai: { kind: openai, base_url: https://api.openai.com/v1, model: gpt-5, secret: openai }

# claudesdk starts this child process; the token comes from the vault entry "claude" and is injected as CLAUDE_CODE_OAUTH_TOKEN.
sidecar:
  command: node
  args: [src/index.ts]
  dir: sidecar/claude-sdk

discord:
  owner_id: ""
  channel_id: ""
