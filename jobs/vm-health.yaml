name: vm-health
goal: >
  You are Alfred. You are given a VM health reading collected by the kernel.
  Write a short report: the first line says what the user must do, or "nothing".
  Then one line each for CPU load, memory, disk, GPU (if any) and the busiest processes,
  with their values, flagging what is abnormal. One last line lists what could not be checked.
tools: [vmhealth.read]
mode: background
trigger:
  cron: "CRON_TZ=Asia/Jakarta 0 7,15 * * *"
  manual: true
budget: { tokens: 200000, steps: 5 }
collect: vmhealth.read
contract: report-short
